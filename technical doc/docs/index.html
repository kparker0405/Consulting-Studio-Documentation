<html>
  <head>
  <link rel="icon" href="favicon.png" />
</head>
</html>


<script>
    window.$docsify = {
      loadSidebar: true,
      subMaxLevel: 3,
      name: '',
      repo: '',

      search: 'auto', // default

      // complete configuration parameters
      search: {
        maxAge: 86400000, // Expiration time, the default one day
        paths: 'auto',
        placeholder: 'Type to search',
        noData: 'No Results!',
        // Headline depth, 1 - 6
        depth: 6,
        hideOtherSidebarContent: false, // whether or not to hide other sidebar content
     }
    }

  <body>
    <div id="app"></div>
    <script>
        window.$docsify = {
            // GENERAL
            // -----------------------------------------------------------------
            name: 'docsify-copy-code',
            repo: 'https://github.com/jperasmus/docsify-copy-code',
            loadNavbar: 'navbar.md',
            // themeColor: 'purple',

            // NAVIGATION
            // -----------------------------------------------------------------
            alias: {
                // Reuse navbar for all locals
                '/.*/navbar.md': '/navbar.md',
                // Locals
              
            },

            // PLUGINS
            // -----------------------------------------------------------------
            copyCode: {
                // buttonText : 'buttonText:String',
                // errorText  : 'errorText:String',
                // successText: 'successText:String'

                buttonText: {
                 
                    '/': 'Copy to clipboard'
                },
                errorText: {
                
                    '/': 'Error'
                },
                successText: {
                    '/': 'Copied'
                }
            }
        }
    </script>
    <script src="https://unpkg.com/docsify@4"></script>
    <script src="/dist/docsify-copy-code.js"></script>


  </script>
  <script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
<script src="https://kit.fontawesome.com/ca74324571.js" crossorigin="anonymous"></script>
  <script src="//unpkg.com/docsify/lib/plugins/search.min.js"></script>
</body>
